      <circle cx="742" cy="114" r="8" fill="#FF8A1C"/>
      <circle cx="766" cy="114" r="8" fill="#FACC15"/>
      <circle cx="790" cy="114" r="8" fill="#22C55E"/>

      <rect x="738" y="176" width="112" height="330" rx="26" fill="#152A41"/>
      <rect x="766" y="208" width="54" height="12" rx="6" fill="#A9C7E3"/>
      <rect x="766" y="244" width="54" height="54" rx="18" fill="#234162"/>
      <rect x="781" y="260" width="24" height="22" rx="8" fill="#40C0FF"/>
      <rect x="766" y="326" width="58" height="10" rx="5" fill="#7794B3"/>
      <rect x="766" y="354" width="58" height="10" rx="5" fill="#7794B3"/>
      <rect x="766" y="382" width="58" height="10" rx="5" fill="#7794B3"/>

      <rect x="882" y="176" width="270" height="116" rx="24" fill="#F8FBFE"/>
      <text x="908" y="214" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Users</text>
      <rect x="1040" y="196" width="106" height="30" rx="15" fill="#E78612"/>
      <text x="1093" y="216" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">POST /api</text>
      <text x="908" y="246" fill="#637086" font-family="Arial, Helvetica, sans-serif" font-size="15">Query-driven list and</text>
      <text x="908" y="268" fill="#637086" font-family="Arial, Helvetica, sans-serif" font-size="15">mutation flows</text>
      <rect x="908" y="276" width="94" height="12" rx="6" fill="#D7E6F3"/>

      <rect x="882" y="300" width="126" height="182" rx="24" fill="#FFF7EC"/>
      <rect x="1026" y="300" width="126" height="182" rx="24" fill="#EEF6FF"/>
      <rect x="910" y="332" width="88" height="18" rx="9" fill="#F59E0B"/>
      <rect x="910" y="364" width="88" height="18" rx="9" fill="#18B47B"/>
      <rect x="1054" y="332" width="88" height="18" rx="9" fill="#3567E0"/>
      <rect x="1054" y="364" width="88" height="18" rx="9" fill="#7B45E6"/>
      <text x="945" y="456" fill="#A2640A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Theme picker</text>
      <text x="1089" y="456" fill="#2552D6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Routes</text>
